name: Merge M3U

on:
  push:
    paths:
      - '**/*.m3u'
      - '**/*.m3u8'
      - '!all.m3u'
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 合并 M3U
        run: python3 merge_m3u.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all.m3u
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "自动合并 M3U [skip ci]"
            git push
          fi
